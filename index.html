<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>梅小文 | 红色讲解助手</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{width:100%;height:100%;overflow-x:hidden}
        body{font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;background:#FAF6F0;color:#333}

        /* ===== Header ===== */
        .header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:linear-gradient(135deg,#8B0000,#A52A2A);border-bottom:3px solid #DAA520;position:fixed;top:0;left:0;right:0;z-index:100}
        .header-left{display:flex;align-items:center;gap:10px}
        .logo-circle{width:42px;height:42px;border-radius:50%;background:#FDF8F0;display:flex;align-items:center;justify-content:center;border:2px solid #DAA520;font-size:20px;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,0.2)}
        .header-title-wrap{display:flex;flex-direction:column}
        .header-title{font-size:16px;font-weight:700;color:#FFF8E7;letter-spacing:1px;line-height:1.3}
        .header-sub{font-size:10px;color:rgba(255,248,231,0.8);line-height:1.3}
        .header-right{font-size:10px;color:rgba(255,248,231,0.75);text-align:right;line-height:1.5;flex-shrink:0}
        .header-spacer{height:68px}

        /* ===== Subtitle bar ===== */
        .sub-bar{text-align:center;padding:14px 16px 8px}
        .sub-bar h2{font-size:17px;color:#8B0000;font-weight:700;margin-bottom:4px}
        .sub-bar h2 .icon{margin-right:4px}
        .sub-bar p{font-size:12px;color:#999}

        /* ===== Main content ===== */
        .main-wrap{max-width:480px;margin:0 auto;padding:8px 16px 30px}
        .content-card{background:#fff;border-radius:14px;box-shadow:0 2px 16px rgba(0,0,0,0.06);padding:30px 20px 40px;text-align:center;position:relative;min-height:420px;display:flex;flex-direction:column;align-items:center;justify-content:center}

        .avatar-wrap{width:100px;height:100px;border-radius:50%;border:3px solid #DAA520;overflow:hidden;margin-bottom:18px;box-shadow:0 4px 14px rgba(218,165,32,0.2);background:#FDF8F0}
        .avatar-wrap img{width:100%;height:100%;object-fit:cover}

        .main-title{font-size:22px;font-weight:700;color:#8B0000;margin-bottom:10px;letter-spacing:1px}
        .main-desc{font-size:13px;color:#777;line-height:1.8;max-width:320px;margin-bottom:24px}

        .start-btn{display:inline-block;padding:13px 36px;background:linear-gradient(135deg,#8B0000,#A52A2A);color:#FFD700;border:none;border-radius:26px;font-size:16px;font-weight:700;cursor:pointer;transition:all 0.3s;box-shadow:0 4px 14px rgba(139,0,0,0.25);letter-spacing:2px;-webkit-tap-highlight-color:transparent}
        .start-btn:active{transform:scale(0.96);box-shadow:0 2px 8px rgba(139,0,0,0.3)}

        .footer{text-align:center;padding:12px 16px 16px;font-size:10px;color:#bbb}

        /* ===== Floating character ===== */
        .mxw-float{position:fixed;bottom:90px;right:8px;z-index:90;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
        .mxw-float img{width:72px;height:auto;display:block;filter:drop-shadow(0 2px 6px rgba(0,0,0,0.12));transition:transform 0.2s}
        .mxw-float:active img{transform:scale(0.95)}
        @keyframes floatBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
        .mxw-float img{animation:floatBounce 3s ease-in-out infinite}

        /* ===== Speech bubble ===== */
        .mxw-bubble{position:fixed;bottom:170px;right:8px;background:#fff;color:#8B0000;padding:8px 12px;border-radius:14px 14px 4px 14px;font-size:11px;box-shadow:0 2px 10px rgba(139,0,0,0.1);z-index:90;max-width:145px;line-height:1.5;border:1px solid #E8E0D4;opacity:0;transform:translateY(6px);transition:opacity 0.3s,transform 0.3s;pointer-events:none}
        .mxw-bubble.show{opacity:1;transform:translateY(0)}

        /* ===== Chat fullscreen ===== */
        .chat-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;z-index:9999;background:#fff}
        .chat-overlay.active{display:flex;flex-direction:column}
        .chat-topbar{height:48px;background:linear-gradient(135deg,#8B0000,#A52A2A);display:flex;align-items:center;justify-content:space-between;padding:0 14px;flex-shrink:0}
        .chat-topbar-title{color:#FFF8E7;font-size:15px;font-weight:600}
        .chat-topbar-close{background:none;border:none;color:#FFF8E7;font-size:26px;cursor:pointer;padding:2px 8px;line-height:1}
        .chat-body{flex:1;position:relative;overflow:hidden}
        .chat-body iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none}
        .chat-loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
        .spinner{width:36px;height:36px;border:3px solid #e8e0d4;border-top:3px solid #8B0000;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 12px}
        @keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
        .loading-text{font-size:14px;color:#8B0000;font-weight:500}

        /* ===== Mobile ===== */
        @media(max-width:420px){
            .header{padding:10px 12px}
            .logo-circle{width:36px;height:36px;font-size:17px}
            .header-title{font-size:14px}
            .header-sub{font-size:9px}
            .header-right{font-size:9px}
            .header-spacer{height:60px}
            .sub-bar h2{font-size:15px}
            .sub-bar p{font-size:11px}
            .main-wrap{padding:6px 10px 24px}
            .content-card{padding:24px 16px 32px;min-height:360px}
            .avatar-wrap{width:86px;height:86px}
            .main-title{font-size:20px}
            .main-desc{font-size:12px}
            .mxw-float img{width:60px}
            .mxw-bubble{bottom:155px;font-size:10px;max-width:125px}
        }
    </style>
</head>
