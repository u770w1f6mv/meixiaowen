<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>梅小文 · 红色讲解助手</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#FAF6F0;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.header{background:linear-gradient(135deg,#8B0000,#A52A2A);color:#FFF8E7;padding:12px 16px;text-align:center;flex-shrink:0}
.header h1{font-size:18px;font-weight:600;margin-bottom:2px}
.header p{font-size:12px;opacity:.8}
.home{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.home .avatar{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#8B0000,#DC143C);display:flex;align-items:center;justify-content:center;font-size:36px;margin-bottom:16px;box-shadow:0 4px 12px rgba(139,0,0,.3)}
.home h2{font-size:20px;color:#333;margin-bottom:8px}
.home p{font-size:14px;color:#666;margin-bottom:24px;line-height:1.6}
.btn{background:linear-gradient(135deg,#8B0000,#A52A2A);color:#FFF8E7;border:none;padding:12px 32px;border-radius:24px;font-size:16px;cursor:pointer;box-shadow:0 2px 8px rgba(139,0,0,.3);transition:transform .2s}
.btn:active{transform:scale(.96)}
.chat-wrap{flex:1;display:none;flex-direction:column;overflow:hidden}
.chat-wrap.active{display:flex}
.chat-header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:linear-gradient(135deg,#8B0000,#A52A2A)}
.chat-header span{color:#FFF8E7;font-size:16px;font-weight:600}
.chat-header button{background:none;border:none;color:#FFF8E7;font-size:24px;cursor:pointer;padding:2px 8px}
.chat-frame{flex:1;border:none;width:100%}
.loading{text-align:center;padding:40px 20px}
.spinner{width:36px;height:36px;border:3px solid #e0d5c5;border-top-color:#8B0000;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{color:#8B0000;font-size:14px}
.features{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap;justify-content:center}
.feature{background:#fff;border:1px solid #e0d5c5;border-radius:12px;padding:8px 14px;font-size:13px;color:#666}
</style>
</head>
<body>
<div class="header">
<h1>梅小文 · 红色讲解助手</h1>
<p>南京梅园新村 · 云南南华长征古道</p>
</div>
<div class="home" id="homePage">
<div class="avatar">🤖</div>
<h2>你好，我是梅小文</h2>
<p>红色历史、人物故事、参观导览<br>都可以问我哦！</p>
<div class="features">
<span class="feature">📖 历史故事</span>
<span class="feature">🗺️ 参观导览</span>
<span class="feature">👤 人物传记</span>
</div>
<button class="btn" onclick="startChat()">开始对话</button>
</div>
<div class="chat-wrap" id="chatPage">
<div class="chat-header">
<span>💬 梅小文 · 红色讲解助手</span>
<button onclick="goHome()">✕</button>
</div>
<div class="loading" id="chatLoading">
<div class="spinner"></div>
<p>正在连接梅小文...</p>
</div>
<iframe class="chat-frame" id="chatFrame" style="display:none" allow="clipboard-read;clipboard-write;microphone"></iframe>
</div>
<script>
function startChat(){
  document.getElementById('homePage').style.display='none';
  document.getElementById('chatPage').classList.add('active');
  var frame=document.getElementById('chatFrame');
  var loading=document.getElementById('chatLoading');
  frame.onload=function(){loading.style.display='none';frame.style.display='block'};
  frame.onerror=function(){loading.innerHTML='<p style="color:#999">加载失败，请检查网络</p>'};
  frame.src='https://www.coze.cn/share/7672718942758256680';
}
function goHome(){
  document.getElementById('chatPage').classList.remove('active');
  document.getElementById('homePage').style.display='';
  document.getElementById('chatFrame').src='';
  document.getElementById('chatLoading').style.display='';
  document.getElementById('chatLoading').innerHTML='<div class="spinner"></div><p>正在连接梅小文...</p>';
}
</script>
</body>
</html>
