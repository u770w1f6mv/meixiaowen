<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>梅小文 | 红色讲解助手</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:#FAF6F0;height:100vh;overflow:hidden}
        .header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:linear-gradient(135deg,#8B0000,#A52A2A);border-bottom:3px solid #DAA520;position:fixed;top:0;left:0;right:0;z-index:100}
        .header-spacer{height:75px}
        .header-left{display:flex;align-items:center;gap:12px}
        .logo{width:44px;height:44px;border-radius:50%;background:#FDF8F0;display:flex;align-items:center;justify-content:center;font-size:24px;border:2px solid #DAA520}
        .header-title{font-size:17px;font-weight:600;color:#FFF8E7;letter-spacing:1px}
        .header-sub{font-size:11px;color:rgba(255,248,231,0.85);margin-top:2px}
        .header-right{font-size:11px;color:rgba(255,248,231,0.7);text-align:right;line-height:1.4}
        #chatFrame{width:100%;height:calc(100vh - 75px);border:none;margin-top:75px}
        .error-overlay{display:none;position:fixed;top:75px;left:0;right:0;bottom:0;background:#FAF6F0;z-index:200;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}
        .error-overlay.show{display:flex}
        .error-overlay h3{color:#8B0000;font-size:18px;margin-bottom:12px}
        .error-overlay p{color:#666;font-size:14px;line-height:1.7;margin-bottom:20px}
        .error-overlay a{display:inline-block;padding:10px 24px;background:#8B0000;color:#FFD700;text-decoration:none;border-radius:20px;font-size:14px;font-weight:600}
    </style>
</head>
<body>
    <header class="header">
        <div class="header-left">
            <div class="logo">🏛️</div>
            <div>
                <div class="header-title">梅小文 · 红色讲解助手</div>
                <div class="header-sub">东南大学建筑学院梅美与共实践团</div>
            </div>
        </div>
        <div class="header-right">厚植家国情怀<br>赓续红色血脉</div>
    </header>
    <div class="header-spacer"></div>
    <iframe id="chatFrame" src="https://www.coze.cn/store/agent/7672751495569276978" allow="clipboard-read;clipboard-write;microphone"></iframe>
    <div class="error-overlay" id="errorOverlay">
        <h3>⏳ 加载中...</h3>
        <p>如果长时间无法加载，请尝试直接打开</p>
        <a href="https://www.coze.cn/store/agent/7672751495569276978" target="_blank">直接打开梅小文对话 →</a>
    </div>
    <script>
        setTimeout(function(){
            var f=document.getElementById('chatFrame');
            try{
                if(!f.contentDocument&&!f.contentWindow){
                    document.getElementById('errorOverlay').classList.add('show');
                }
            }catch(e){}
        },12000);
        document.getElementById('chatFrame').onload=function(){
            document.getElementById('errorOverlay').classList.remove('show');
        };
    </script>
</body>
</html>
